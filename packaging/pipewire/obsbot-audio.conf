# Standalone PipeWire client: pipewire -c /path/to/obsbot-audio.conf
# Requires RNNoise LADSPA and SWH plugins (sc4m and fastLookaheadLimiter).
# No audio-server restart needed. Hardware is opened only while a client uses
# the virtual microphone. Target only the OBSBOT, never an unrelated default mic.
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name = aec/libspa-aec-webrtc
        monitor.mode = true
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            webrtc.high_pass_filter = true
            webrtc.noise_suppression = false
            webrtc.transient_suppression = false
            # PipeWire warns that AGC degrades echo delay estimation.
            webrtc.gain_control = false
        }
        capture.props = {
            node.name = obsbot_calls_capture
            target.object = "alsa_input.usb-Remo_Tech_Co.__Ltd._OBSBOT_Tiny_3_Lite-02.analog-stereo"
            node.passive = true
            node.dont-fallback = true
        }
        source.props = {
            node.name = obsbot_calls_aec
            node.description = "OBSBOT Echo Stage"
            node.hidden = true
            media.class = Audio/Source
            priority.session = 0
        }
        playback.props = {
            node.name = obsbot_calls_speaker_reference
            node.passive = true
        }
      }
    }
    # Speech processing follows echo cancellation so compression does not
    # distort the echo reference. RNNoise replaces WebRTC noise suppression.
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "OBSBOT Calls (Speech Optimized)"
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        filter.graph = {
          nodes = [
            { type = ladspa name = denoise
              plugin = librnnoise_ladspa label = noise_suppressor_mono
              control = {
                "VAD Threshold (%)" = 50.0
                "VAD Grace Period (ms)" = 200
                "Retroactive VAD Grace (ms)" = 20
                "Dry Mix" = 0
              }
            }
            { type = builtin name = warmth label = bq_peaking
              control = { "Freq" = 250 "Q" = 0.8 "Gain" = -2.5 }
            }
            { type = builtin name = presence label = bq_peaking
              control = { "Freq" = 3000 "Q" = 0.8 "Gain" = 2.0 }
            }
            { type = builtin name = soften label = bq_highshelf
              control = { "Freq" = 8000 "Q" = 0.707 "Gain" = -1.5 }
            }
            { type = ladspa name = compressor plugin = sc4m_1916 label = sc4m
              control = {
                "RMS/peak" = 0
                "Attack time (ms)" = 10
                "Release time (ms)" = 180
                "Threshold level (dB)" = -22
                "Ratio (1:n)" = 3
                "Knee radius (dB)" = 6
                "Makeup gain (dB)" = 3
              }
            }
            { type = ladspa name = limiter plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
              control = { "Input gain (dB)" = 0 "Limit (dB)" = -2 "Release time (s)" = 0.1 }
            }
          ]
          links = [
            { output = "denoise:Output" input = "warmth:In" }
            { output = "warmth:Out" input = "presence:In" }
            { output = "presence:Out" input = "soften:In" }
            { output = "soften:Out" input = "compressor:Input" }
            { output = "compressor:Output" input = "limiter:Input 1" }
            { output = "compressor:Output" input = "limiter:Input 2" }
          ]
          inputs = [ "denoise:Input" ]
          outputs = [ "limiter:Output 1" ]
        }
        capture.props = {
            node.name = obsbot_calls_speech_capture
            target.object = obsbot_calls_aec
            node.passive = true
            node.dont-fallback = true
            audio.rate = 48000
        }
        playback.props = {
            node.name = obsbot_calls
            node.description = "OBSBOT Calls (Speech Optimized)"
            media.class = Audio/Source
            priority.session = 2200
            audio.rate = 48000
        }
      }
    }
]
