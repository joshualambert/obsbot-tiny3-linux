# Standalone PipeWire client: pipewire -c /path/to/obsbot-audio.conf
# No audio-server restart needed. Hardware is opened only while a client uses
# the virtual microphone. Target only the OBSBOT, never an unrelated default mic.
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name = aec/libspa-aec-webrtc
        monitor.mode = true
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            webrtc.high_pass_filter = true
            webrtc.noise_suppression = true
            # PipeWire warns that AGC degrades echo delay estimation.
            webrtc.gain_control = false
        }
        capture.props = {
            node.name = obsbot_calls_capture
            target.object = "alsa_input.usb-Remo_Tech_Co.__Ltd._OBSBOT_Tiny_3_Lite-02.analog-stereo"
            node.passive = true
            node.dont-fallback = true
        }
        source.props = {
            node.name = obsbot_calls
            node.description = "OBSBOT Calls (Noise + Echo Reduction)"
            media.class = Audio/Source
            priority.session = 2200
        }
        playback.props = {
            node.name = obsbot_calls_speaker_reference
            node.passive = true
        }
      }
    }
]
