# Example Hyprland keybindings for obsbot-tiny3 (vanilla Hyprland `.conf` form).
#
# For OMARCHY users: do NOT source this file. Omarchy configures Hyprland in
# Lua — copy the snippets from `bindings.omarchy.lua` into
# ~/.config/hypr/bindings.lua instead.
#
# For vanilla Hyprland: source this from your hyprland.conf, e.g.
#   source = ~/.config/hypr/obsbot-tiny3.conf
# then adjust the key combos to taste (these use SUPER+ALT to avoid clashes).

# Camera sleep toggle — the headline feature. Notifies the resulting state.
bind = SUPER ALT, C, exec, sh -c 'notify-send -a OBSBOT "OBSBOT Tiny 3" "Camera now $(t3ctl toggle)"'

# Recenter the gimbal (park).
bind = SUPER ALT, R, exec, t3ctl recenter

# Toggle AI subject tracking. Notifies the resulting state.
bind = SUPER ALT, T, exec, sh -c 'notify-send -a OBSBOT "OBSBOT Tiny 3" "Tracking $(t3ctl track toggle)"'
